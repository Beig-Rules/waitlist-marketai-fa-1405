<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>هوش مصنوعی تحلیل بازار | لیست انتظار</title>
<style>:root{--bg:#fff;--text:#111;--muted:#666;--accent:#000;--border:#e5e5e5;--card:#fafafa}[data-theme=dark]{--bg:#0a0a0a;--text:#f5f5f5;--muted:#aaa;--accent:#fff;--border:#2a2a2a;--card:#141414}*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:var(--bg);color:var(--text);line-height:1.7}.c{max-width:720px;margin:0 auto;padding:0 20px;text-align:center}header{padding:20px 0;border-bottom:1px solid var(--border)}h1{font-size:2.6rem;font-weight:800;margin:40px 0 16px}input,button{padding:14px;font-size:1rem;border-radius:4px;border:1px solid var(--border);width:100%;max-width:360px;margin:8px}button{background:var(--accent);color:var(--bg);border:none;cursor:pointer;font-weight:600}.form{margin:32px 0}footer{padding:40px 0;color:var(--muted);font-size:.9rem}</style></head>
<body><header><div class="c">MarketAI</div></header>
<section class="c"><h1>تحلیل بازار با هوش مصنوعی<br>به زودی</h1><p style="color:var(--muted)">ابزار فارسی برای کشف فرصت‌ها، رقبا و روندهای ناشی از داده‌های وب و شبکه‌های اجتماعی.</p>
<form class="form" onsubmit="alert('ثبت شدید!');return false"><input type="email" placeholder="ایمیل خود را وارد کنید" required><br><button>عضویت در لیست انتظار</button></form>
<p style="color:var(--muted);font-size:.9rem">بیش از ۱۲۰۰ نفر ثبت کرده‌اند.</p></section>
<footer><div class="c">© ۱۴۰۵ MarketAI — تولید One-Page Studio</div></footer>
<script>if(matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark')</script></body></html>
